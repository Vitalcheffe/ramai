name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy opencv-python-headless pytest reportlab ruff
      - run: ruff check rami/ --select E,F,W --ignore E501 --exit-zero
      - run: python -m pytest tests/ -q
